<!--
  PC통신 진입 화면의 글꼴과 스타일. <head> 에서 불러야 첫 페인트부터 제대로 그려진다.
  글꼴은 블로그 본문과 같은 둥근모꼴. 크기는 16px 로 둔다.
  16px 격자로 그려진 비트맵이라 그 배수에서만 픽셀이 딱 떨어지고, 18px 은 1.125배로
  늘어나면서 획이 번져 굵어 보인다. 단말 화면은 또렷한 편이 낫다.
-->
<link rel="preload" as="font" type="font/woff2"
      href="{{ '/assets/fonts/DungGeunMo-intro.woff2' | relative_url }}" crossorigin>

<style>
/*
  블로그 본문과 같은 둥근모꼴을 쓴다. 그래야 같은 사이트로 읽힌다.
  다만 이 화면에 나오는 글자만 남긴 부분집합이다 (924KB -> 5KB).
  영문 80 / 한글 160 units 로 정확히 반각·전각 고정폭이라 단말 화면에 맞는다.
  만드는 법은 assets/fonts/README.md 참고.
  화면 문구를 고치면 글자가 모자랄 수 있으니 그때 다시 만들 것.
*/
@font-face {
    font-family: DungGeunMoIntro;
    font-style: normal;
    font-weight: 400;
    /* 5KB라 금방 온다. 다른 글꼴로 찍혔다 바뀌는 것보다 잠깐 비는 편이 낫다 */
    font-display: block;
    src: url('{{ '/assets/fonts/DungGeunMo-intro.woff2' | relative_url }}') format('woff2');
}

html, body { margin: 0; padding: 0; background: #000; height: 100%; }

#bbs {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    font-family: DungGeunMoIntro, DungGeunMo, D2Coding, Consolas, monospace;
    transition: opacity .45s ease;
}
#bbs[hidden] { display: none !important; }
#bbs.bbs-out { opacity: 0; }

.bbs-win {
    width: 100%;
    /* 가장 긴 줄이 512px. 여백 포함 560px 이면 줄이 접히지 않는다 */
    max-width: 560px;
    background: #0000a8;
    border: 2px solid #3a3a6a;
    box-shadow: 0 0 0 1px #000, 0 14px 50px rgba(0, 0, 0, .8);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* 창 제목 표시줄 — 그 시절 통신 에뮬레이터 느낌 */
.bbs-title {
    display: flex;
    /* 창 장식이라 단말 글꼴이 아니라 시스템 글꼴을 쓴다 */
    font-family: "Segoe UI", Tahoma, sans-serif;
    align-items: center;
    gap: 6px;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    font-size: 11px;
    padding: 4px 4px 4px 7px;
    flex: 0 0 auto;
}
.bbs-title .sp { margin-left: auto; }
.bbs-title b {
    display: inline-block;
    width: 17px;
    height: 15px;
    line-height: 14px;
    text-align: center;
    background: #c0c0c0;
    color: #000;
    border: 1px solid #fff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    font-size: 11px;
    font-weight: 400;
}

.bbs-screen {
    /*
      <pre> 는 브라우저 기본 스타일에 pre { font-family: monospace } 가 "요소 자체"로 걸려 있다.
      요소에 직접 걸린 규칙이 부모로부터의 상속을 이기므로, 여기서 다시 지정하지 않으면
      #bbs 에 적어둔 글꼴이 먹지 않고 브라우저 기본 고정폭이 쓰인다.
    */
    font-family: inherit;
    margin: 0;
    padding: 12px 14px;
    /* 18행 고정. 실제 단말처럼 넘치는 줄은 위로 밀려 올라간다 (JS가 잘라낸다) */
    height: 396px;        /* 18행 x 22px */
    box-sizing: content-box;
    color: #c8c8c8;
    font-size: 16px;      /* 둥근모꼴의 설계 격자. 여기서만 픽셀이 딱 떨어진다 */
    line-height: 22px;
    /* 좁은 화면에서는 줄이 접힌다. 접히더라도 JS가 항상 맨 아래로 붙여준다 */
    white-space: pre-wrap;
    word-break: break-all;
    overflow: hidden;
    flex: 0 0 auto;
}

/* 상태 표시줄 */
.bbs-status {
    display: flex;
    /* 창 장식이다. 11px 에서 비트맵 글꼴은 뭉개지므로 시스템 글꼴을 쓴다 */
    font-family: "Segoe UI", Tahoma, sans-serif;
    flex-wrap: wrap;
    background: #c0c0c0;
    color: #000;
    font-size: 11px;
    line-height: 1.7;
    border-top: 2px solid #000080;
    flex: 0 0 auto;
}
.bbs-status span {
    padding: 2px 8px;
    border-right: 1px solid #808080;
    white-space: nowrap;
}
.bbs-status span:last-child { border-right: 0; margin-left: auto; }
.bbs-led { color: #008000; letter-spacing: -1px; }

/* 색상 — 옛 ANSI 팔레트 */
.c-w  { color: #fff; }
.c-cy { color: #54fcfc; }
.c-cd { color: #00a8a8; }
.c-ye { color: #fcfc54; }
.c-mg { color: #fc54fc; }
.c-gn { color: #54fc54; }
.c-dim { color: #8a8ac0; }

.bbs-cur {
    display: inline-block;
    width: .5em;
    height: 1em;
    margin-bottom: -.12em;
    background: #c8c8c8;
    animation: bbs-blink 1s steps(1) infinite;
}
@keyframes bbs-blink { 50% { opacity: 0; } }

/*
  주사선 · 비네팅 · 화면 떨림은 넣었다가 뺐다.
  "모니터를 촬영한 영상"처럼 보여서, 화면 자체의 또렷함을 해쳤다.
  비트맵 글꼴은 픽셀이 그대로 보일 때가 가장 그 시절 같다.
*/

.bbs-skip {
    position: absolute;
    right: 14px;
    bottom: 12px;
    z-index: 100000;
    background: rgba(0, 0, 0, .5);
    color: #9a9ac8;
    border: 1px solid #3a3a6a;
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
}
.bbs-skip:hover { color: #fff; border-color: #6a6aa0; }

/*
  둥근모꼴은 16px 격자로 그려진 비트맵이라 16의 배수에서만 픽셀이 딱 떨어진다.
  그래서 좁은 화면에서도 크기를 줄이지 않는다. 대신 줄이 접히고, JS가 맨 아래로 붙여준다.
*/
@media (max-width: 620px) {
    .bbs-screen { padding: 8px; }
    .bbs-status span:nth-child(4), .bbs-status span:nth-child(5) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    .bbs-cur { animation: none; }
}
</style>
