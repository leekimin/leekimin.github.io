<!--
  PC통신 스타일 진입 화면.
  홈(/)은 원래 /blog/ 로 곧장 넘기던 빈 페이지였다. 그 자리를 접속 연출로 채우고
  연출이 끝나면 원래대로 /blog/ 로 보낸다.

  - 한 세션에 한 번만 재생한다 (sessionStorage). 두 번째부터는 즉시 이동.
  - 아무 키/클릭이면 즉시 건너뛴다.
  - prefers-reduced-motion 이면 재생하지 않는다.
  - JS가 죽어도 <noscript> 와 안전 타이머로 반드시 /blog/ 에 도착한다.
  - 다시 보려면 /?intro=1
-->

<div id="bbs" hidden>
    <div class="bbs-win">
        <div class="bbs-title">
            <span>ZERO(0) BBS - 접속</span>
            <span class="sp"></span><b>_</b><b>□</b><b>×</b>
        </div>
        <!-- 완성된 줄과 그리는 중인 줄을 나눠 둔다. 매 프레임 화면 전체를 다시 만들지 않기 위해서다 -->
        <pre class="bbs-screen" id="bbs-screen"><span id="bbs-done"></span><span id="bbs-cur"></span></pre>
        <div class="bbs-status">
            <span>&lt;한글&gt;-2</span>
            <span class="bbs-led" id="bbs-led">■■</span>
            <span>연결 <em id="bbs-elapsed">0:00</em></span>
            <span>KS5601 완성</span>
            <span>1- 19200-N-8-1</span>
            <span>갈무리 끝</span>
            <span id="bbs-clock">0:00:00</span>
        </div>
    </div>
    <button class="bbs-skip" id="bbs-skip" type="button">건너뛰기 (아무 키나)</button>
</div>

<noscript>
    <meta http-equiv="refresh" content="0; url={{ '/blog/' | relative_url }}">
</noscript>

<script>
(function () {
    'use strict';

    var TARGET = "{{ '/blog/' | relative_url }}";
    var KEY = 'bbsIntroSeen';
    var ROWS = 18;          // 화면에 보이는 줄 수. 넘치면 위로 밀려 올라간다

    function go() { window.location.replace(TARGET); }

    var forced = /[?&]intro=1/.test(window.location.search);
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var seen = false;
    try { seen = sessionStorage.getItem(KEY) === '1'; } catch (e) { /* 사생활 보호 모드 */ }

    // 이미 봤거나, 모션을 줄이도록 설정했으면 원래대로 곧장 넘어간다
    if (!forced && (seen || reduced)) { go(); return; }
    try { sessionStorage.setItem(KEY, '1'); } catch (e) { /* 무시 */ }

    var root = document.getElementById('bbs');
    var out = document.getElementById('bbs-screen');
    var skipBtn = document.getElementById('bbs-skip');
    if (!root || !out) { go(); return; }
    root.hidden = false;

    // 연출이 어디선가 멈춰도 반드시 도착하도록
    var deadman = setTimeout(go, 25000);

    // ── 상태 표시줄: 연결 시간과 시계
    var t0 = Date.now();
    function two(n) { return (n < 10 ? '0' : '') + n; }
    var elapsedEl = document.getElementById('bbs-elapsed');
    var clockEl = document.getElementById('bbs-clock');
    var clockTimer = setInterval(function () {
        var s = Math.floor((Date.now() - t0) / 1000);
        if (elapsedEl) { elapsedEl.textContent = Math.floor(s / 60) + ':' + two(s % 60); }
        if (clockEl) {
            var d = new Date();
            clockEl.textContent = d.getHours() + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
        }
    }, 1000);

    // 수신 표시등 — 글자가 들어오는 동안 깜빡인다
    var ledEl = document.getElementById('bbs-led');
    var rx = false;
    var ledTimer = setInterval(function () {
        if (ledEl) { ledEl.style.color = rx ? '#00e000' : '#006000'; rx = false; }
    }, 90);

    // ── 화면 버퍼: 완성된 줄 + 지금 그리는 중인 줄
    var CURSOR = '<span class="bbs-cur"></span>';
    var lines = [];
    var cur = '';

    var doneEl = document.getElementById('bbs-done');
    var curEl = document.getElementById('bbs-cur');

    // 완성된 줄. 줄이 늘어날 때만 다시 그린다
    function paintDone() {
        var vis = lines;
        if (vis.length > ROWS - 1) { vis = vis.slice(vis.length - (ROWS - 1)); }
        doneEl.innerHTML = vis.length ? vis.join('\n') + '\n' : '';
        // 줄이 접히는 좁은 화면에서도 늘 마지막 줄이 보이도록
        out.scrollTop = out.scrollHeight;
    }
    // 그리는 중인 줄. 글자 하나 들어올 때마다 여기만 바뀐다
    function paintCur() { curEl.innerHTML = cur + CURSOR; }
    function paint() { paintDone(); paintCur(); }
    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function wrap(s, cls) { return cls ? '<span class="' + cls + '">' + esc(s) + '</span>' : esc(s); }

    // ── 연출 대본
    //  out  = 회선으로 들어오는 글자 (빠르게 흘러 들어옴)
    //  type = 사람이 자판을 두드리는 글자 (from 위치부터 한 글자씩)
    //  wait = 대기,  clear = 화면 지움
    var S = [
        { k: 'type', s: 'ATZ', cls: 'c-dim', sp: 70 },
        { k: 'out',  s: 'OK', cls: 'c-dim' },
        { k: 'type', s: 'ATDT', cls: 'c-dim', sp: 70 },
        { k: 'wait', ms: 620 },
        { k: 'out',  s: 'CONNECT 19200', cls: 'c-dim' },
        { k: 'wait', ms: 260 },
        { k: 'out',  s: '' },
        { k: 'out',  s: 'Trying zero.bbs ...', cls: 'c-w' },
        { k: 'wait', ms: 380 },
        { k: 'out',  s: 'Connected to zero.bbs.', cls: 'c-w' },
        { k: 'out',  s: "Escape character is '^]'.", cls: 'c-w' },
        { k: 'out',  s: '' },
        { k: 'wait', ms: 220 },
        { k: 'out',  s: 'SunOS 5.6', cls: 'c-w' },
        { k: 'wait', ms: 380 },
        { k: 'out',  s: '' },
        { k: 'out',  s: '[63 "701456789;0A"?', cls: 'c-dim' },
        { k: 'out',  s: "'ZERO(0)'에 오신 것을 환영합니다.(1ion% pts/0)!!", cls: 'c-w' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '      ◎  Z E R O ( 0 )  정보통신망  ◎', cls: 'c-cy' },
        { k: 'out',  s: '  ────────────────────────────────────────────', cls: 'c-cd' },
        { k: 'out',  s: '   매일 아침 6시, 학습 기록이 자동으로 올라옵니다.', cls: 'c-w' },
        { k: 'out',  s: '   사람의 검수 없이 게시되므로 오류가 있을 수 있습니다.', cls: 'c-dim' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '  » 쿠버네티스 · 시스템 아키텍처 · AI-DLC · 투잡 아이디어', cls: 'c-gn' },
        { k: 'out',  s: '  » 댓글은 GitHub 계정으로 작성할 수 있습니다.', cls: 'c-gn' },
        { k: 'out',  s: '' },
        { k: 'wait', ms: 280 },
        { k: 'out',  s: "ID가 없는 분은 '손님' 또는 'GUEST'를 입력하십시오.", cls: 'c-ye' },
        { k: 'out',  s: '' },
        { k: 'type', s: '아 이 디 : leekimin', cls: 'c-w', sp: 62, from: 9 },
        { k: 'wait', ms: 220 },
        { k: 'type', s: '비밀번호 : ********', cls: 'c-w', sp: 55, from: 9 },
        { k: 'wait', ms: 400 },
        { k: 'out',  s: '' },
        { k: 'out',  s: '접속을 확인하고 있습니다 ...', cls: 'c-dim' },
        { k: 'wait', ms: 560 },
        { k: 'clear' },
        { k: 'out',  s: 'ZERO(0)', cls: 'c-cy' },
        { k: 'out',  s: 'TOP                    초기화면            leekimin.github.io', cls: 'c-dim' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '  [ 기본서비스 ]   1. 안내/소개    2. 블 로 그    3. 카테고리', cls: 'c-w' },
        { k: 'out',  s: '  [ 커뮤니티   ]  11. 태    그   12. 댓    글   13. GitHub', cls: 'c-w' },
        { k: 'out',  s: '  [ 소 모 임   ]  21. 민이마을', cls: 'c-ye' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '  ★ HOT   매일 06:00 자동 게시! 오늘 글은 벌써 올라왔습니다', cls: 'c-mg' },
        { k: 'out',  s: '  ★ COOL  투잡 아이디어 — 앱스토어 순위로 찾는 하루짜리 프로젝트', cls: 'c-cy' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '  ─────────────────────────────────────────────────────────', cls: 'c-cd' },
        { k: 'out',  s: '명령어안내(C) 직접이동(GO) 종료(X)', cls: 'c-dim' },
        { k: 'wait', ms: 400 },
        { k: 'type', s: '선택> 2', cls: 'c-ye', sp: 180, from: 6 },
        { k: 'wait', ms: 340 },
        { k: 'out',  s: '' },
        { k: 'out',  s: '블로그로 이동합니다 ...', cls: 'c-gn' },
        { k: 'wait', ms: 500 }
    ];

    var timer = null;
    var done = false;

    function finish() {
        if (done) { return; }
        done = true;
        clearTimeout(timer);
        clearTimeout(deadman);
        clearInterval(clockTimer);
        clearInterval(ledTimer);
        root.classList.add('bbs-out');
        setTimeout(go, 420);
    }

    // 한 줄을 다 그리고 나면 완성된 줄로 넘긴다
    function commit(next, gap) {
        lines.push(cur);
        cur = '';
        paint();
        timer = setTimeout(next, gap);
    }

    var i = 0;
    function step() {
        if (done) { return; }
        if (i >= S.length) { finish(); return; }
        var it = S[i++];

        if (it.k === 'wait') { timer = setTimeout(step, it.ms); return; }
        if (it.k === 'clear') { lines = []; cur = ''; paint(); timer = setTimeout(step, 240); return; }

        var text = it.s;
        if (text.length === 0) { commit(step, 34); return; }

        if (it.k === 'out') {
            // 회선으로 들어오는 글자. 한 번에 3~8자씩 몰아 들어와야 모뎀처럼 보인다
            var n = 0;
            (function wire() {
                if (done) { return; }
                n = Math.min(text.length, n + 3 + Math.floor(Math.random() * 6));
                cur = wrap(text.slice(0, n), it.cls);
                rx = true;
                paintCur();
                if (n < text.length) { timer = setTimeout(wire, 16); }
                else { commit(step, 24); }
            }());
            return;
        }

        // type: 프롬프트까지는 이미 화면에 있고, 그 뒤를 사람이 친다
        var head = it.s.slice(0, it.from || 0);
        var tail = it.s.slice(it.from || 0);
        var m = 0;
        (function key() {
            if (done) { return; }
            m++;
            cur = wrap(head + tail.slice(0, m), it.cls);
            paintCur();
            if (m < tail.length) { timer = setTimeout(key, it.sp); }
            else { commit(step, 120); }
        }());
    }

    // 아무 키나 클릭이면 건너뛴다
    function skip(ev) {
        if (ev && ev.type === 'keydown' && (ev.metaKey || ev.ctrlKey || ev.altKey)) { return; }
        finish();
    }
    document.addEventListener('keydown', skip);
    root.addEventListener('click', skip);
    root.addEventListener('touchstart', skip, { passive: true });
    if (skipBtn) { skipBtn.addEventListener('click', skip); }

    // 파란 창과 깜빡이는 커서는 즉시 보여준다 (모뎀 기다리는 화면처럼)
    paint();

    // 둥근모꼴은 비트맵 고정폭이라, 늦게 와서 다른 글꼴로 찍히면 글자 폭이 달라져 열이 어긋난다.
    // 글꼴이 준비된 뒤에 시작하고, 너무 늦으면 그냥 시작한다.
    var started = false;
    function begin() {
        if (started || done) { return; }
        started = true;
        step();
    }
    if (document.fonts && document.fonts.load) {
        var fontTimer = setTimeout(begin, 1500);
        var ready = function () { clearTimeout(fontTimer); begin(); };
        try {
            document.fonts.load('16px DungGeunMoIntro', '가나다').then(ready, ready);
        } catch (e) { ready(); }
    } else {
        begin();
    }
}());
</script>
