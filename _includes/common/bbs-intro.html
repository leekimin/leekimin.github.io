<!--
  PC통신 스타일 진입 화면.
  홈(/)은 원래 /blog/ 로 곧장 넘기던 빈 페이지였다. 그 자리를 접속 연출로 채우고
  연출이 끝나면 원래대로 /blog/ 로 보낸다.

  - 한 세션에 한 번만 재생한다 (sessionStorage). 두 번째부터는 즉시 이동.
  - 아무 키/클릭이면 즉시 건너뛴다.
  - prefers-reduced-motion 이면 재생하지 않는다.
  - JS가 죽어도 <noscript> 와 안전 타이머로 반드시 /blog/ 에 도착한다.
  - 다시 보려면 /?intro=1
-->

<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">

<style>
#bbs {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    font-family: "Nanum Gothic Coding", D2Coding, Consolas, "Courier New", monospace;
    transition: opacity .45s ease;
}
#bbs[hidden] { display: none !important; }
#bbs.bbs-out { opacity: 0; }

.bbs-win {
    width: 100%;
    max-width: 780px;
    background: #0000a8;
    border: 2px solid #3a3a6a;
    box-shadow: 0 0 0 1px #000, 0 14px 50px rgba(0, 0, 0, .8);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* 창 제목 표시줄 — 그 시절 통신 에뮬레이터 느낌 */
.bbs-title {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 4px 3px 6px;
    letter-spacing: .02em;
    flex: 0 0 auto;
}
.bbs-title .sp { margin-left: auto; }
.bbs-title b {
    display: inline-block;
    width: 16px;
    height: 14px;
    line-height: 12px;
    text-align: center;
    background: #c0c0c0;
    color: #000;
    border: 1px solid #fff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    font-size: 10px;
    font-weight: 700;
}

.bbs-screen {
    margin: 0;
    padding: 10px 12px;
    min-height: 22em;
    color: #c8c8c8;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-all;
    overflow: hidden;
    flex: 1 1 auto;
}

/* 상태 표시줄 */
.bbs-status {
    display: flex;
    flex-wrap: wrap;
    background: #c0c0c0;
    color: #000;
    font-size: 11px;
    line-height: 1.6;
    border-top: 2px solid #000080;
    flex: 0 0 auto;
}
.bbs-status span {
    padding: 1px 7px;
    border-right: 1px solid #808080;
    white-space: nowrap;
}
.bbs-status span:last-child { border-right: 0; margin-left: auto; }
.bbs-led { color: #008000; letter-spacing: -1px; }

/* 색상 — 옛 ANSI 팔레트 */
.c-w  { color: #fff; }
.c-cy { color: #54fcfc; }
.c-cd { color: #00a8a8; }
.c-ye { color: #fcfc54; }
.c-mg { color: #fc54fc; }
.c-gn { color: #54fc54; }
.c-dim { color: #8a8ac0; }
.c-inv { background: #c8c8c8; color: #0000a8; }

.bbs-cur {
    display: inline-block;
    width: .62em;
    height: 1.05em;
    margin-bottom: -.18em;
    background: #c8c8c8;
    animation: bbs-blink 1s steps(1) infinite;
}
@keyframes bbs-blink { 50% { opacity: 0; } }

/* CRT 느낌: 주사선 + 가장자리 어둠 */
.bbs-crt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(rgba(0, 0, 0, .22) 0 1px, rgba(0, 0, 0, 0) 1px 3px),
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .55) 100%);
}

.bbs-skip {
    position: absolute;
    right: 14px;
    bottom: 12px;
    z-index: 100000;
    background: rgba(0, 0, 0, .5);
    color: #9a9ac8;
    border: 1px solid #3a3a6a;
    font: inherit;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
}
.bbs-skip:hover { color: #fff; border-color: #6a6aa0; }

@media (max-width: 600px) {
    .bbs-screen { font-size: 10px; padding: 8px; min-height: 20em; }
    .bbs-status { font-size: 9.5px; }
    .bbs-status span:nth-child(4), .bbs-status span:nth-child(5) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    .bbs-cur { animation: none; }
}
</style>

<div id="bbs" hidden>
    <div class="bbs-win">
        <div class="bbs-title">
            <span>ZERO(0) BBS - 접속</span>
            <span class="sp"></span><b>_</b><b>□</b><b>×</b>
        </div>
        <pre class="bbs-screen" id="bbs-screen"></pre>
        <div class="bbs-status">
            <span>&lt;한글&gt;-2</span>
            <span class="bbs-led">■■</span>
            <span>연결 <em id="bbs-elapsed">0:00</em></span>
            <span>KS5601 완성</span>
            <span>1- 19200-N-8-1</span>
            <span>갈무리 끝</span>
            <span id="bbs-clock">0:00:00</span>
        </div>
        <div class="bbs-crt"></div>
    </div>
    <button class="bbs-skip" id="bbs-skip" type="button">건너뛰기 (아무 키나)</button>
</div>

<noscript>
    <meta http-equiv="refresh" content="0; url={{ '/blog/' | relative_url }}">
</noscript>

<script>
(function () {
    'use strict';

    var TARGET = "{{ '/blog/' | relative_url }}";
    var KEY = 'bbsIntroSeen';

    function go() { window.location.replace(TARGET); }

    var forced = /[?&]intro=1/.test(window.location.search);
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var seen = false;
    try { seen = sessionStorage.getItem(KEY) === '1'; } catch (e) { /* 사생활 보호 모드 */ }

    // 이미 봤거나, 모션을 줄이도록 설정했으면 원래대로 곧장 넘어간다
    if (!forced && (seen || reduced)) { go(); return; }
    try { sessionStorage.setItem(KEY, '1'); } catch (e) { /* 무시 */ }

    var root = document.getElementById('bbs');
    var screen = document.getElementById('bbs-screen');
    var skipBtn = document.getElementById('bbs-skip');
    if (!root || !screen) { go(); return; }
    root.hidden = false;

    // 연출이 어디선가 멈춰도 반드시 도착하도록
    var deadman = setTimeout(go, 20000);

    // ── 상태 표시줄 시계
    var t0 = Date.now();
    function two(n) { return (n < 10 ? '0' : '') + n; }
    var clockTimer = setInterval(function () {
        var s = Math.floor((Date.now() - t0) / 1000);
        var el = document.getElementById('bbs-elapsed');
        if (el) { el.textContent = Math.floor(s / 60) + ':' + two(s % 60); }
        var d = new Date();
        var ck = document.getElementById('bbs-clock');
        if (ck) { ck.textContent = d.getHours() + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()); }
    }, 1000);

    // ── 화면 출력
    var cursor = '<span class="bbs-cur"></span>';
    var buf = '';
    function paint() { screen.innerHTML = buf + cursor; }

    function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function wrap(s, cls) { return cls ? '<span class="' + cls + '">' + esc(s) + '</span>' : esc(s); }

    // ── 연출 대본
    // kind: out=즉시 출력, type=한 글자씩, wait=대기, clear=화면 지움
    var S = [
        { k: 'type', s: 'ATZ', cls: 'c-dim', sp: 70 },
        { k: 'out',  s: 'OK', cls: 'c-dim' },
        { k: 'type', s: 'ATDT', cls: 'c-dim', sp: 70 },
        { k: 'wait', ms: 620 },
        { k: 'out',  s: 'CONNECT 19200', cls: 'c-dim' },
        { k: 'wait', ms: 300 },
        { k: 'out',  s: '' },
        { k: 'out',  s: 'Trying zero.bbs ...', cls: 'c-w' },
        { k: 'wait', ms: 420 },
        { k: 'out',  s: 'Connected to zero.bbs.', cls: 'c-w' },
        { k: 'out',  s: "Escape character is '^]'.", cls: 'c-w' },
        { k: 'out',  s: '' },
        { k: 'wait', ms: 260 },
        { k: 'out',  s: 'SunOS 5.6', cls: 'c-w' },
        { k: 'wait', ms: 420 },
        { k: 'out',  s: '' },
        { k: 'out',  s: '[63 "701456789;0A"?', cls: 'c-dim' },
        { k: 'out',  s: "'ZERO(0)'에 오신 것을 환영합니다.(1ion% pts/0)!!", cls: 'c-w' },
        { k: 'out',  s: '' },
        { k: 'wait', ms: 260 },
        { k: 'out',  s: '      ◈  Z E R O ( 0 )  정보통신망  ◈', cls: 'c-cy' },
        { k: 'out',  s: '  ────────────────────────────────────────────', cls: 'c-cd' },
        { k: 'out',  s: '   매일 아침 6시, 학습 기록이 자동으로 올라옵니다.', cls: 'c-w' },
        { k: 'out',  s: '   사람의 검수 없이 게시되므로 오류가 있을 수 있습니다.', cls: 'c-dim' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '  ▷ 쿠버네티스 · 시스템 아키텍처 · AI-DLC · 투잡 아이디어', cls: 'c-gn' },
        { k: 'out',  s: '  ▷ 댓글은 GitHub 계정으로 작성할 수 있습니다.', cls: 'c-gn' },
        { k: 'out',  s: '' },
        { k: 'wait', ms: 340 },
        { k: 'out',  s: "ID가 없는 분은 '손님' 또는 'GUEST'를 입력하십시오.", cls: 'c-ye' },
        { k: 'out',  s: '' },
        { k: 'type', s: '아 이 디 : leekimin', cls: 'c-w', sp: 62, from: 9 },
        { k: 'wait', ms: 240 },
        { k: 'type', s: '비밀번호 : ********', cls: 'c-w', sp: 55, from: 9 },
        { k: 'wait', ms: 450 },
        { k: 'out',  s: '' },
        { k: 'out',  s: '접속을 확인하고 있습니다 ...', cls: 'c-dim' },
        { k: 'wait', ms: 620 },
        { k: 'clear' },
        { k: 'out',  s: 'ZERO(0)', cls: 'c-cy' },
        { k: 'out',  s: 'TOP                    초기화면            leekimin.github.io', cls: 'c-dim' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '  [ 기본서비스 ]   1. 안내/소개    2. 블 로 그    3. 카테고리', cls: 'c-w' },
        { k: 'out',  s: '  [ 커 뮤 니 티 ]  11. 태    그   12. 댓    글   13. GitHub', cls: 'c-w' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '  ▶ HOT   매일 06:00 자동 게시! 오늘 글은 벌써 올라왔습니다', cls: 'c-mg' },
        { k: 'out',  s: '  ▶ COOL  투잡 아이디어 — 앱스토어 순위로 찾는 하루짜리 프로젝트', cls: 'c-cy' },
        { k: 'out',  s: '' },
        { k: 'out',  s: '  ─────────────────────────────────────────────────────────', cls: 'c-cd' },
        { k: 'out',  s: '명령어안내(C) 직접이동(GO) 종료(X)', cls: 'c-dim' },
        { k: 'wait', ms: 450 },
        { k: 'type', s: '선택> 2', cls: 'c-ye', sp: 180, from: 6 },
        { k: 'wait', ms: 380 },
        { k: 'out',  s: '' },
        { k: 'out',  s: '블로그로 이동합니다 ...', cls: 'c-gn' },
        { k: 'wait', ms: 520 }
    ];

    var timer = null;
    var done = false;

    function finish() {
        if (done) { return; }
        done = true;
        clearTimeout(timer);
        clearTimeout(deadman);
        clearInterval(clockTimer);
        root.classList.add('bbs-out');
        setTimeout(go, 420);
    }

    var i = 0;
    function step() {
        if (done) { return; }
        if (i >= S.length) { finish(); return; }
        var it = S[i++];

        if (it.k === 'wait') { timer = setTimeout(step, it.ms); return; }
        if (it.k === 'clear') { buf = ''; paint(); timer = setTimeout(step, 260); return; }
        if (it.k === 'out') { buf += wrap(it.s, it.cls) + '\n'; paint(); timer = setTimeout(step, 42); return; }

        // type: from 위치까지는 한 번에 찍고, 그 뒤부터 한 글자씩
        var head = it.s.slice(0, it.from || 0);
        var tail = it.s.slice(it.from || 0);
        var base = buf + wrap(head, it.cls);
        var n = 0;
        (function tick() {
            if (done) { return; }
            n++;
            buf = base + wrap(tail.slice(0, n), it.cls);
            paint();
            if (n < tail.length) {
                timer = setTimeout(tick, it.sp);
            } else {
                buf += '\n';
                timer = setTimeout(step, 120);
            }
        }());
    }

    // 아무 키나 클릭이면 건너뛴다
    function skip(ev) {
        if (ev && ev.type === 'keydown' && (ev.metaKey || ev.ctrlKey || ev.altKey)) { return; }
        finish();
    }
    document.addEventListener('keydown', skip);
    root.addEventListener('click', skip);
    root.addEventListener('touchstart', skip, { passive: true });
    if (skipBtn) { skipBtn.addEventListener('click', skip); }

    paint();
    step();
}());
</script>
